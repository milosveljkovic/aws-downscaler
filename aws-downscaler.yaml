aws:
  eu-west-1:
    ec2:
      - name: qa-env
        tags:
          - name: downscale
            value: "true"
          - name: scaledown
            value: yes
        downtime: "Mon-Wed 14:00-08:00 UTC   , Wed-Fri 20:00-08:00 UTC"
        downtime_state: "stop"
      - name: night-ec2
        tags:
          - name: owner
            value: "milosve"
        downtime: "Wed-Mon 20:00-08:00 Europe/Belgrade"
